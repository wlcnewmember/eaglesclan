<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Claim AM Prem Free | XNR</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at 20% 30%, #0a1a2e, #020812);
      color: #e0f2fe;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 520px;
      width: 100%;
      background: rgba(8, 20, 40, 0.8);
      backdrop-filter: blur(16px);
      border-radius: 32px;
      border: 1px solid rgba(0, 180, 255, 0.15);
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
      animation: fadeUp 0.6s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: #7dd3fc;
      text-shadow: 0 0 30px rgba(56, 189, 248, 0.2);
    }

    .header h1 i {
      color: #38bdf8;
      margin-right: 10px;
    }

    .header .sub {
      font-size: 0.8rem;
      color: #6a9fc9;
      margin-top: 5px;
    }

    .info-box {
      background: rgba(0, 40, 80, 0.2);
      border-radius: 16px;
      padding: 16px 20px;
      margin: 20px 0;
      border: 1px solid rgba(56, 189, 248, 0.08);
      text-align: center;
    }

    .info-box p {
      font-size: 0.9rem;
      color: #b8d4e6;
      line-height: 1.6;
    }

    .info-box i {
      color: #38bdf8;
      margin-right: 8px;
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    .form-group label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: #bddcee;
    }

    .form-group label i {
      color: #38bdf8;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(0, 20, 50, 0.5);
      border: 1px solid rgba(56, 189, 248, 0.15);
      border-radius: 14px;
      color: #e5f3ff;
      font-size: 0.95rem;
      outline: none;
      transition: 0.2s;
      font-family: 'Poppins', sans-serif;
    }

    input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.1);
      background: rgba(0, 30, 70, 0.5);
    }

    .btn-primary {
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      border: none;
      color: white;
      font-weight: 700;
      font-size: 1rem;
      padding: 14px 28px;
      border-radius: 60px;
      width: 100%;
      cursor: pointer;
      transition: 0.3s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
      margin-top: 10px;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(14, 165, 233, 0.5);
      background: linear-gradient(135deg, #38bdf8, #0284c7);
    }

    .back-link {
      text-align: center;
      margin-top: 18px;
      font-size: 0.8rem;
      color: #5a8aaa;
      cursor: pointer;
      transition: 0.2s;
      display: block;
    }

    .back-link:hover {
      color: #7dd3fc;
    }

    .back-link i {
      margin-right: 6px;
    }

    .credit {
      text-align: center;
      margin-top: 25px;
      font-size: 0.6rem;
      color: #2a5a7a;
      border-top: 1px solid rgba(56, 189, 248, 0.05);
      padding-top: 16px;
    }

    .credit i {
      color: #38bdf8;
      margin-right: 4px;
    }

    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(2, 8, 18, 0.95);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 999;
    }

    .loading-overlay.show {
      display: flex;
    }

    .loading-spinner {
      width: 45px;
      height: 45px;
      border: 3px solid rgba(56, 189, 248, 0.08);
      border-top: 3px solid #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 1rem;
      color: #b0d4ee;
      letter-spacing: 2px;
    }

    .loading-sub {
      font-size: 0.75rem;
      color: #4a7a9a;
      margin-top: 8px;
    }

    @media (max-width: 600px) {
      .container { padding: 1.5rem 1.2rem; }
      .header h1 { font-size: 1.3rem; }
    }
  </style>
</head>
<body>

<div class="container">

  <div class="header">
    <h1><i class="fas fa-gift"></i> CLAIM AM PREM FREE</h1>
    <div class="sub">Dapatkan Alight Motion Premium Gratis!</div>
  </div>

  <div class="info-box">
    <p><i class="fas fa-info-circle"></i> Isi data berikut untuk mengklaim AM Premium.</p>
    <p style="font-size: 0.8rem; color: #6a8aaa; margin-top: 6px;">Setelah submit, kamu akan diarahkan ke halaman tonton iklan.</p>
  </div>

  <form id="claimForm">
    <div class="form-group">
      <label><i class="fas fa-user"></i> Nama Lengkap</label>
      <input type="text" id="namaClaim" placeholder="ex: Arka Veyron" required>
    </div>

    <div class="form-group">
      <label><i class="fab fa-tiktok"></i> Username TikTok</label>
      <input type="text" id="tiktokClaim" placeholder="@usernamekamu" required>
    </div>

    <button type="submit" class="btn-primary">
      <i class="fas fa-play-circle"></i> TONTON IKLAN DULU
    </button>
  </form>

  <a class="back-link" onclick="window.location.href='index.html'">
    <i class="fas fa-arrow-left"></i> Kembali ke Beranda
  </a>

  <div class="credit">
    <i class="fas fa-copyright"></i> 2025 • XNR Selection
  </div>

</div>

<!-- LOADING -->
<div id="loadingOverlay" class="loading-overlay">
  <div class="loading-spinner"></div>
  <div class="loading-text"><i class="fas fa-hourglass-half"></i> SABAR, DATA SEDANG DIPROSES</div>
  <div class="loading-sub">harap tunggu sebentar...</div>
</div>

<script>
  // ===== KONFIGURASI =====
  // Simpan data di localStorage biar bisa dipakai di halaman iklan
  function simpanDataClaim(nama, tiktok) {
    localStorage.setItem('claim_nama', nama);
    localStorage.setItem('claim_tiktok', tiktok);
  }

  // ===== LOADING =====
  function showLoading() {
    document.getElementById('loadingOverlay').classList.add('show');
  }

  function hideLoading() {
    document.getElementById('loadingOverlay').classList.remove('show');
  }

  // ===== SUBMIT FORM =====
  document.getElementById('claimForm').addEventListener('submit', function(e) {
    e.preventDefault();

    var nama = document.getElementById('namaClaim').value.trim();
    var tiktok = document.getElementById('tiktokClaim').value.trim();

    if (!nama) { alert("Masukkan nama lengkap!"); return; }
    if (!tiktok) { alert("Masukkan username TikTok!"); return; }

    // Simpan data ke localStorage
    simpanDataClaim(nama, tiktok);

    showLoading();

    // Redirect ke halaman tonton iklan
    setTimeout(function() {
      hideLoading();
      window.location.href = 'iklan-claim.html';
    }, 1500);
  });

  console.log("Claim AM Prem Free siap - redirect ke iklan!");
</script>

</body>
</html>
