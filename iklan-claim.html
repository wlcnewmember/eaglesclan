<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Tonton Iklan | Claim AM Prem</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at 20% 30%, #0a1a2e, #020812);
      color: #e0f2fe;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 520px;
      width: 100%;
      background: rgba(8, 20, 40, 0.8);
      backdrop-filter: blur(16px);
      border-radius: 32px;
      border: 1px solid rgba(0, 180, 255, 0.15);
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
      animation: fadeUp 0.6s ease;
      text-align: center;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.6rem;
      color: #7dd3fc;
      text-shadow: 0 0 30px rgba(56, 189, 248, 0.2);
      margin-bottom: 10px;
    }

    .header h1 i {
      color: #38bdf8;
      margin-right: 10px;
    }

    .sub {
      font-size: 0.8rem;
      color: #6a9fc9;
      margin-bottom: 20px;
    }

    .counter-box {
      background: rgba(0, 40, 80, 0.2);
      border-radius: 20px;
      padding: 25px;
      margin: 20px 0;
      border: 1px solid rgba(56, 189, 248, 0.15);
    }

    .counter-number {
      font-size: 4rem;
      font-weight: 700;
      color: #38bdf8;
      text-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
    }

    .counter-label {
      font-size: 0.9rem;
      color: #8ab4d6;
      margin-top: 8px;
    }

    .counter-label i {
      margin-right: 6px;
      color: #38bdf8;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: rgba(56, 189, 248, 0.1);
      border-radius: 10px;
      margin: 15px 0;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0ea5e9, #38bdf8);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      border: none;
      color: white;
      font-weight: 700;
      font-size: 1rem;
      padding: 14px 28px;
      border-radius: 60px;
      width: 100%;
      cursor: pointer;
      transition: 0.3s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
      margin-top: 10px;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(14, 165, 233, 0.5);
      background: linear-gradient(135deg, #38bdf8, #0284c7);
    }

    .btn-primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .back-link {
      text-align: center;
      margin-top: 18px;
      font-size: 0.8rem;
      color: #5a8aaa;
      cursor: pointer;
      transition: 0.2s;
      display: block;
    }

    .back-link:hover {
      color: #7dd3fc;
    }

    .back-link i {
      margin-right: 6px;
    }

    .credit {
      margin-top: 25px;
      font-size: 0.6rem;
      color: #2a5a7a;
      border-top: 1px solid rgba(56, 189, 248, 0.05);
      padding-top: 16px;
    }

    .credit i {
      color: #38bdf8;
      margin-right: 4px;
    }

    .ad-container {
      background: rgba(0, 20, 40, 0.5);
      border-radius: 16px;
      padding: 20px;
      margin: 20px 0;
      border: 1px dashed rgba(56, 189, 248, 0.2);
      min-height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    .ad-container p {
      color: #6a8aaa;
      font-size: 0.8rem;
    }

    .ad-container .fake-ad {
      background: rgba(56, 189, 248, 0.05);
      padding: 30px;
      border-radius: 12px;
      width: 100%;
      text-align: center;
    }

    .fake-ad i {
      font-size: 2.5rem;
      color: #38bdf8;
      margin-bottom: 10px;
    }

    .fake-ad h3 {
      color: #7dd3fc;
      font-size: 1rem;
    }

    .fake-ad p {
      color: #6a8aaa;
      font-size: 0.8rem;
    }

    @media (max-width: 600px) {
      .container { padding: 1.5rem 1.2rem; }
      .counter-number { font-size: 3rem; }
    }
  </style>
</head>
<body>

<div class="container">

  <div class="header">
    <h1><i class="fas fa-play-circle"></i> TONTON IKLAN</h1>
    <div class="sub">Tonton 5 iklan untuk membuka kunci Claim AM Prem</div>
  </div>

  <!-- COUNTER -->
  <div class="counter-box">
    <div class="counter-number" id="counterDisplay">0</div>
    <div class="counter-label"><i class="fas fa-film"></i> / 5 Iklan</div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <!-- TEMPAT IKLAN -->
  <div class="ad-container" id="adContainer">
    <div class="fake-ad">
      <i class="fas fa-video"></i>
      <h3>Iklan Video</h3>
      <p>Klik tombol di bawah untuk menonton</p>
    </div>
  </div>

  <!-- TOMBOL TONTON IKLAN -->
  <button class="btn-primary" id="watchAdBtn">
    <i class="fas fa-play"></i> Tonton Iklan
  </button>

  <!-- TOMBOL CLAIM (AKTIF SETELAH 5 IKLAN) -->
  <button class="btn-primary" id="claimBtn" disabled style="margin-top: 10px;">
    <i class="fas fa-gift"></i> CLAIM AM PREM SEKARANG
  </button>

  <a class="back-link" onclick="window.location.href='index.html'">
    <i class="fas fa-arrow-left"></i> Kembali ke Beranda
  </a>

  <div class="credit">
    <i class="fas fa-copyright"></i> 2025 • XNR Selection
  </div>

</div>

<!-- ===== IKLAN POPUNDER ADSTERRA ===== -->
<script src="https://pl30309659.effectivecpmnetwork.com/6c/6e/8a/6c6e8a5bedbce5186f8eaf3fd2f311d1.js"></script>

<script>
  // ===== KONFIGURASI =====
  let watchCount = 0;
  const targetCount = 5;

  const counterDisplay = document.getElementById('counterDisplay');
  const progressFill = document.getElementById('progressFill');
  const watchAdBtn = document.getElementById('watchAdBtn');
  const claimBtn = document.getElementById('claimBtn');

  // ===== AMBIL PROGRESS DARI LOCALSTORAGE =====
  const savedCount = localStorage.getItem('watchCount');
  if (savedCount !== null) {
    watchCount = parseInt(savedCount);
  }

  // ===== CEK APAKAH INI RELOAD DARI TOMBOL =====
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.has('reload')) {
    console.log('Reload detected - popunder should appear');
  }

  // ===== UPDATE UI =====
  function updateUI() {
    counterDisplay.textContent = watchCount;
    const progress = (watchCount / targetCount) * 100;
    progressFill.style.width = progress + '%';

    if (watchCount >= targetCount) {
      watchAdBtn.disabled = true;
      watchAdBtn.innerHTML = '<i class="fas fa-check"></i> Selesai!';
      claimBtn.disabled = false;
    } else {
      watchAdBtn.disabled = false;
      watchAdBtn.innerHTML = '<i class="fas fa-play"></i> Tonton Iklan';
      claimBtn.disabled = true;
    }

    // Simpan progress ke localStorage
    localStorage.setItem('watchCount', watchCount);
  }

  // ===== TONTON IKLAN =====
  function watchAd() {
    if (watchCount >= targetCount) return;

    // Tambah counter
    watchCount++;
    localStorage.setItem('watchCount', watchCount);
    updateUI();

    // Reload halaman biar popunder muncul lagi
    window.location.href = 'iklan-claim.html?reload=' + Date.now();
  }

  // ===== CLAIM AM PREM =====
  function claimAmPrem() {
    if (watchCount < targetCount) {
      alert("Tonton dulu 5 iklan!");
      return;
    }

    // Ambil data dari localStorage
    const nama = localStorage.getItem('claim_nama') || 'Tidak diketahui';
    const tiktok = localStorage.getItem('claim_tiktok') || 'Tidak diketahui';

    // Buat pesan WhatsApp
    const pesan = `CLAIM AM PREM FREE\n\n👤 Nama: ${nama}\n📱 TikTok: ${tiktok}\n⏰ Waktu: ${new Date().toLocaleString('id-ID')}`;
    const encodedPesan = encodeURIComponent(pesan);
    const waLink = `https://wa.me/6285782195122?text=${encodedPesan}`;

    // Reset localStorage
    localStorage.removeItem('watchCount');
    localStorage.removeItem('claim_nama');
    localStorage.removeItem('claim_tiktok');

    window.open(waLink, '_blank');
  }

  // ===== EVENT LISTENER =====
  watchAdBtn.addEventListener('click', watchAd);
  claimBtn.addEventListener('click', claimAmPrem);

  // ===== INISIALISASI =====
  updateUI();
  console.log("Halaman Tonton Iklan siap - Popunder Aktif!");
</script>

</body>
</html>
